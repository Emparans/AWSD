<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWSD - Control</title>
    <link rel="stylesheet" href="/static/css/control.css">
    
    <script type="module" src="/static/js/control.js"></script>
    <script src="/static/js/test.js"></script>
    <script src="/static/js/camara.js"></script>
</head>
<body>

    <main>
        <div class="layout-principal">
            
            <div class="col-izq">
                <header class="panel titulo-panel">
                    <h1>AWSD</h1>
                </header>
                
                <div class="canvas-container">
                    <canvas id="juego" width="1480" height="1480"></canvas>
                </div>
            </div>

            <div class="col-der">
                <div class="fila-superior-der">
                    <div id="datos-mapa" class="panel inventario-panel datos-mapa-container">
                        <h3 class="datos-titulo">Datos del Mapa</h3>
                        <div class="datos-grid">
                            <div class="dato-item">
                                <span class="dato-etiqueta">Puntuación</span>
                                <span id="dato-puntuacion" class="dato-valor">0</span>
                            </div>
                            <div class="dato-item">
                                <span class="dato-etiqueta">Tiempo</span>
                                <span id="dato-tiempo" class="dato-valor">00:00</span>
                            </div>
                            <div class="dato-item">
                                <span class="dato-etiqueta">Objeto</span>
                                <span id="dato-nivel" class="dato-valor">Luna</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="panel camara-panel" style="overflow: hidden; display: flex; align-items: center; justify-content: center;">
                        <canvas id="stream-camara" style="width: 100%; height: 100%; object-fit: cover;"></canvas>
                    </div>
                </div>
                
                <div id="contenedor_pregunta" class="panel preguntas-panel">
                    <p>Esperando pregunta</p>
                </div>
            </div>
            
        </div>

        <div class="panel barra-inferior">
            <a href="/" class="btn-back">Volver a la página anterior</a>
            <button class="btn">Pausar</button>
            <button class="btn">Reanudar</button>
            <button class="btn" onclick="abrirPopUp()">Guardar</button>
        </div>
    </main>

    <div id="capaFondo" class="popup-fondo" style="display: none;">
        <div class="popup-contenido">
            <h3>Guardar Mapa actual</h3>
            <p>Introduce los datos:</p>
            <input type="text" id="inputNombre" placeholder="Nombre del mapa...">
            <input type="text" id="inputCreador" placeholder="Nombre del creador...">
            <div class="popup-botones">
                <button class="btn btn-cancelar" onclick="cerrarPopUp()">Cancelar</button>
                <button class="btn" onclick="enviarDatos()">Enviar</button>
            </div>
        </div>
    </div>

</body>
</html>
